<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motivational Journal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>🌟 Motivational Journal</h1>
    <p id="quote-box">Click below to get inspired!</p>
    <button id="quote-btn">Get Quote</button>

    <h2>✍️ Write Your Journal</h2>
    <textarea id="journal-input" placeholder="Write your thoughts here..."></textarea>
    <button id="save-btn">Save Entry</button>

    <h2>📖 Your Journal Entries</h2>
    <ul id="journal-list"></ul>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
